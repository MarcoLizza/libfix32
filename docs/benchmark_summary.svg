<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="727" viewBox="0 0 1000 727" role="img" aria-labelledby="title desc">
  <title id="title">fix32 benchmark fixed/base ratio summary</title>
  <desc id="desc">Horizontal bar chart showing representative fixed/base ratios from the benchmark output. Lower ratios favor the fixed-point path; 1.0 is parity.</desc>
  <style>
    .title { font: 700 26px Arial, Helvetica, sans-serif; fill: #172033; }
    .subtitle { font: 15px Arial, Helvetica, sans-serif; fill: #566273; }
    .axis { stroke: #d8dee8; stroke-width: 1; }
    .parity { stroke: #172033; stroke-width: 2; stroke-dasharray: 5 5; }
    .label { font: 14px Arial, Helvetica, sans-serif; fill: #233044; }
    .group { font: 700 15px Arial, Helvetica, sans-serif; fill: #172033; }
    .tick { font: 12px Arial, Helvetica, sans-serif; fill: #697587; }
    .value { font: 700 13px Arial, Helvetica, sans-serif; fill: #172033; }
    .note { font: 13px Arial, Helvetica, sans-serif; fill: #566273; }
    .faster { fill: #2f8f83; }
    .slower { fill: #c86b38; }
    .neutral { fill: #6b7280; }
  </style>

  <rect width="1000" height="727" fill="#ffffff"/>

  <text x="40" y="42" class="title">Benchmark ratio summary</text>
  <text x="40" y="68" class="subtitle">Fixed-point time divided by float/base time. Lower is better for the fixed-point path; 1.0 is parity.</text>

  <rect x="40" y="84" width="14" height="14" rx="2" class="faster"/>
  <text x="62" y="96" class="note">fixed faster</text>
  <rect x="170" y="84" width="14" height="14" rx="2" class="neutral"/>
  <text x="192" y="96" class="note">near parity</text>
  <rect x="296" y="84" width="14" height="14" rx="2" class="slower"/>
  <text x="318" y="96" class="note">fixed slower</text>

  <line x1="280" y1="120" x2="280" y2="617" class="axis"/>
  <line x1="404" y1="120" x2="404" y2="617" class="axis"/>
  <line x1="528" y1="120" x2="528" y2="617" class="parity"/>
  <line x1="652" y1="120" x2="652" y2="617" class="axis"/>
  <line x1="776" y1="120" x2="776" y2="617" class="axis"/>
  <line x1="900" y1="120" x2="900" y2="617" class="axis"/>

  <text x="280" y="112" text-anchor="middle" class="tick">0</text>
  <text x="404" y="112" text-anchor="middle" class="tick">0.5</text>
  <text x="528" y="112" text-anchor="middle" class="tick">1.0 parity</text>
  <text x="652" y="112" text-anchor="middle" class="tick">1.5</text>
  <text x="776" y="112" text-anchor="middle" class="tick">2</text>
  <text x="900" y="112" text-anchor="middle" class="tick">2.5</text>

  <text x="40" y="136" class="group">Workloads, mean ratio</text>
  <text x="260" y="163" text-anchor="end" class="label">sprite scaler</text>
  <rect x="280" y="148" width="44" height="20" rx="4" class="faster"/>
  <text x="334" y="163" class="value">0.18</text>
  <text x="260" y="196" text-anchor="end" class="label">rotoscaler incremental</text>
  <rect x="280" y="181" width="142" height="20" rx="4" class="faster"/>
  <text x="432" y="196" class="value">0.57</text>
  <text x="260" y="229" text-anchor="end" class="label">DDA line</text>
  <rect x="280" y="214" width="176" height="20" rx="4" class="faster"/>
  <text x="466" y="229" class="value">0.71</text>
  <text x="260" y="262" text-anchor="end" class="label">rotoscaler direct</text>
  <rect x="280" y="247" width="245" height="20" rx="4" class="neutral"/>
  <text x="535" y="262" class="value">0.99</text>
  <text x="40" y="312" class="group">Scalar rows, representative operations</text>
  <text x="260" y="339" text-anchor="end" class="label">sum</text>
  <rect x="280" y="324" width="84" height="20" rx="4" class="faster"/>
  <text x="374" y="339" class="value">0.34</text>
  <text x="260" y="372" text-anchor="end" class="label">floor -&gt; fixed</text>
  <rect x="280" y="357" width="77" height="20" rx="4" class="faster"/>
  <text x="367" y="372" class="value">0.31</text>
  <text x="260" y="405" text-anchor="end" class="label">multiply by int</text>
  <rect x="280" y="390" width="169" height="20" rx="4" class="faster"/>
  <text x="459" y="405" class="value">0.68</text>
  <text x="260" y="438" text-anchor="end" class="label">value -&gt; float</text>
  <rect x="280" y="423" width="248" height="20" rx="4" class="neutral"/>
  <text x="538" y="438" class="value">1.00</text>
  <text x="260" y="471" text-anchor="end" class="label">multiply</text>
  <rect x="280" y="456" width="310" height="20" rx="4" class="slower"/>
  <text x="600" y="471" class="value">1.25</text>
  <text x="260" y="504" text-anchor="end" class="label">float -&gt; fixed round</text>
  <rect x="280" y="489" width="394" height="20" rx="4" class="slower"/>
  <text x="684" y="504" class="value">1.59</text>
  <text x="260" y="537" text-anchor="end" class="label">reciprocal -&gt; fixed</text>
  <rect x="280" y="522" width="422" height="20" rx="4" class="slower"/>
  <text x="712" y="537" class="value">1.70</text>
  <text x="260" y="570" text-anchor="end" class="label">divide</text>
  <rect x="280" y="555" width="541" height="20" rx="4" class="slower"/>
  <text x="831" y="570" class="value">2.18</text>
  <text x="260" y="603" text-anchor="end" class="label">rational -&gt; fixed</text>
  <rect x="280" y="588" width="374" height="20" rx="4" class="slower"/>
  <text x="664" y="603" class="value">1.51</text>

  <line x1="280" y1="633" x2="900" y2="633" class="axis"/>
  <text x="280" y="653" text-anchor="middle" class="tick">0</text>
  <text x="528" y="653" text-anchor="middle" class="tick">1.0</text>
  <text x="900" y="653" text-anchor="middle" class="tick">2.5</text>
  <text x="40" y="701" class="note">Generated from fixed/base ratios.</text>
</svg>
