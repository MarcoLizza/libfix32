<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="837" viewBox="0 0 1000 837" role="img" aria-labelledby="title desc">
  <title id="title">fix32 benchmark fixed/base ratio summary</title>
  <desc id="desc">Horizontal bar chart showing representative fixed/base ratios from the benchmark output. Lower ratios favor the fixed-point path; 1.0 is parity.</desc>
  <style>
    .title { font: 700 26px Arial, Helvetica, sans-serif; fill: #172033; }
    .subtitle { font: 15px Arial, Helvetica, sans-serif; fill: #566273; }
    .axis { stroke: #d8dee8; stroke-width: 1; }
    .parity { stroke: #172033; stroke-width: 2; stroke-dasharray: 5 5; }
    .label { font: 14px Arial, Helvetica, sans-serif; fill: #233044; }
    .group { font: 700 15px Arial, Helvetica, sans-serif; fill: #172033; }
    .tick { font: 12px Arial, Helvetica, sans-serif; fill: #697587; }
    .value { font: 700 13px Arial, Helvetica, sans-serif; fill: #172033; }
    .note { font: 13px Arial, Helvetica, sans-serif; fill: #566273; }
    .faster { fill: #2f8f83; }
    .slower { fill: #c86b38; }
    .neutral { fill: #6b7280; }
  </style>

  <rect width="1000" height="837" fill="#ffffff"/>

  <text x="40" y="42" class="title">Benchmark ratio summary</text>
  <text x="40" y="68" class="subtitle">Fixed-point time divided by float/base time. Lower is better for the fixed-point path; 1.0 is parity.</text>

  <rect x="40" y="84" width="14" height="14" rx="2" class="faster"/>
  <text x="62" y="96" class="note">fixed faster</text>
  <rect x="170" y="84" width="14" height="14" rx="2" class="neutral"/>
  <text x="192" y="96" class="note">near parity</text>
  <rect x="296" y="84" width="14" height="14" rx="2" class="slower"/>
  <text x="318" y="96" class="note">fixed slower</text>

  <line x1="280" y1="120" x2="280" y2="727" class="axis"/>
  <line x1="316" y1="120" x2="316" y2="727" class="axis"/>
  <line x1="352" y1="120" x2="352" y2="727" class="parity"/>
  <line x1="388" y1="120" x2="388" y2="727" class="axis"/>
  <line x1="424" y1="120" x2="424" y2="727" class="axis"/>
  <line x1="460" y1="120" x2="460" y2="727" class="axis"/>
  <line x1="496" y1="120" x2="496" y2="727" class="axis"/>
  <line x1="532" y1="120" x2="532" y2="727" class="axis"/>
  <line x1="568" y1="120" x2="568" y2="727" class="axis"/>
  <line x1="604" y1="120" x2="604" y2="727" class="axis"/>
  <line x1="640" y1="120" x2="640" y2="727" class="axis"/>
  <line x1="676" y1="120" x2="676" y2="727" class="axis"/>
  <line x1="712" y1="120" x2="712" y2="727" class="axis"/>
  <line x1="748" y1="120" x2="748" y2="727" class="axis"/>
  <line x1="783" y1="120" x2="783" y2="727" class="axis"/>
  <line x1="819" y1="120" x2="819" y2="727" class="axis"/>
  <line x1="855" y1="120" x2="855" y2="727" class="axis"/>
  <line x1="891" y1="120" x2="891" y2="727" class="axis"/>

  <text x="280" y="112" text-anchor="middle" class="tick">0</text>
  <text x="316" y="112" text-anchor="middle" class="tick">0.5</text>
  <text x="352" y="112" text-anchor="middle" class="tick">1.0 parity</text>
  <text x="388" y="112" text-anchor="middle" class="tick">1.5</text>
  <text x="424" y="112" text-anchor="middle" class="tick">2</text>
  <text x="460" y="112" text-anchor="middle" class="tick">2.5</text>
  <text x="496" y="112" text-anchor="middle" class="tick">3</text>
  <text x="532" y="112" text-anchor="middle" class="tick">3.5</text>
  <text x="568" y="112" text-anchor="middle" class="tick">4</text>
  <text x="604" y="112" text-anchor="middle" class="tick">4.5</text>
  <text x="640" y="112" text-anchor="middle" class="tick">5</text>
  <text x="676" y="112" text-anchor="middle" class="tick">5.5</text>
  <text x="712" y="112" text-anchor="middle" class="tick">6</text>
  <text x="748" y="112" text-anchor="middle" class="tick">6.5</text>
  <text x="783" y="112" text-anchor="middle" class="tick">7</text>
  <text x="819" y="112" text-anchor="middle" class="tick">7.5</text>
  <text x="855" y="112" text-anchor="middle" class="tick">8</text>
  <text x="891" y="112" text-anchor="middle" class="tick">8.5</text>

  <text x="40" y="136" class="group">Workloads, mean ratio</text>
  <text x="260" y="163" text-anchor="end" class="label">sprite scaler</text>
  <rect x="280" y="148" width="13" height="20" rx="4" class="faster"/>
  <text x="303" y="163" class="value">0.18</text>
  <text x="260" y="196" text-anchor="end" class="label">rotoscaler incremental</text>
  <rect x="280" y="181" width="41" height="20" rx="4" class="faster"/>
  <text x="331" y="196" class="value">0.57</text>
  <text x="260" y="229" text-anchor="end" class="label">DDA line</text>
  <rect x="280" y="214" width="19" height="20" rx="4" class="faster"/>
  <text x="309" y="229" class="value">0.26</text>
  <text x="260" y="262" text-anchor="end" class="label">rotoscaler direct</text>
  <rect x="280" y="247" width="73" height="20" rx="4" class="neutral"/>
  <text x="363" y="262" class="value">1.02</text>
  <text x="40" y="312" class="group">Scalar rows, representative operations</text>
  <text x="260" y="339" text-anchor="end" class="label">sum</text>
  <rect x="280" y="324" width="28" height="20" rx="4" class="faster"/>
  <text x="318" y="339" class="value">0.39</text>
  <text x="260" y="372" text-anchor="end" class="label">floor -&gt; fixed</text>
  <rect x="280" y="357" width="32" height="20" rx="4" class="faster"/>
  <text x="322" y="372" class="value">0.45</text>
  <text x="260" y="405" text-anchor="end" class="label">multiply by int</text>
  <rect x="280" y="390" width="50" height="20" rx="4" class="faster"/>
  <text x="340" y="405" class="value">0.69</text>
  <text x="260" y="438" text-anchor="end" class="label">value -&gt; float</text>
  <rect x="280" y="423" width="72" height="20" rx="4" class="neutral"/>
  <text x="362" y="438" class="value">1.00</text>
  <text x="260" y="471" text-anchor="end" class="label">multiply</text>
  <rect x="280" y="456" width="87" height="20" rx="4" class="slower"/>
  <text x="377" y="471" class="value">1.21</text>
  <text x="260" y="504" text-anchor="end" class="label">float -&gt; fixed round</text>
  <rect x="280" y="489" width="91" height="20" rx="4" class="slower"/>
  <text x="381" y="504" class="value">1.26</text>
  <text x="260" y="537" text-anchor="end" class="label">reciprocal -&gt; fixed</text>
  <rect x="280" y="522" width="123" height="20" rx="4" class="slower"/>
  <text x="413" y="537" class="value">1.71</text>
  <text x="260" y="570" text-anchor="end" class="label">divide</text>
  <rect x="280" y="555" width="168" height="20" rx="4" class="slower"/>
  <text x="458" y="570" class="value">2.34</text>
  <text x="260" y="603" text-anchor="end" class="label">rational -&gt; fixed</text>
  <rect x="280" y="588" width="132" height="20" rx="4" class="slower"/>
  <text x="422" y="603" class="value">1.83</text>
  <text x="40" y="653" class="group">Multiplication, array throughput and dependent work</text>
  <text x="260" y="680" text-anchor="end" class="label">multiply array</text>
  <rect x="280" y="665" width="620" height="20" rx="4" class="slower"/>
  <text x="910" y="680" class="value">8.62</text>
  <text x="260" y="713" text-anchor="end" class="label">multiply/add chain</text>
  <rect x="280" y="698" width="96" height="20" rx="4" class="slower"/>
  <text x="386" y="713" class="value">1.34</text>

  <line x1="280" y1="743" x2="900" y2="743" class="axis"/>
  <text x="280" y="763" text-anchor="middle" class="tick">0</text>
  <text x="352" y="763" text-anchor="middle" class="tick">1.0</text>
  <text x="900" y="763" text-anchor="middle" class="tick">8.62</text>
  <text x="40" y="811" class="note">Source: docs/benchmark_report.md (2026-11-07)</text>
</svg>
